<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLORES DE LETRAS - Réplica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="main-title">COLORES DE LETRAS</h1>

        <div class="color-grid">

            <div class="grid-item color-cool-gray">Cool gray</div>
            <div class="grid-item color-warm-gray">Warm Gray</div>
            <div class="grid-item color-amber">Amber</div>
            <div class="grid-item color-green">Green</div>

            <div class="grid-item color-cyan">Cyan</div>
            <div class="grid-item color-red">Red</div>
            <div class="grid-item color-yellow">Yellow</div>
            <div class="grid-item color-emerald">Emerald</div>

            <div class="grid-item color-sky">Sky</div>
            <div class="grid-item color-orange">Orange</div>
            <div class="grid-item color-lime">Lime</div>
            <div class="grid-item color-teal">Teal</div>

            <div class="grid-item color-fuchsia">Fuchsia</div>
            <div class="grid-item color-pink">Pink</div>
            <div class="grid-item color-rose">Rose</div>
            <div class="grid-item color-blue-gray">Blue Gray</div>

            <div class="grid-item color-purple">Purple</div>
            <div class="grid-item color-violet">Violet</div>
            <div class="grid-item color-indigo">Indigo</div>
            <div class="grid-item color-blue">Blue</div>
        </div>
    </div>
</body>
</html>
